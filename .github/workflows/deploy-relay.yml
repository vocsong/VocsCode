# Deploy the relay with each release, from the same vX.Y.Z tag the installers are built from, so
# production always speaks the protocol of the released desktop. Verifies the exact checkout
# before publishing. Credentials live in GitHub's protected `relay-production` environment, which
# admits release tags only and waits for approval. Every release redeploys (tags skip path filters).
name: Deploy relay

on:
  push:
    tags: ['v*']
  # Redeploy or recover a release: gh workflow run deploy-relay.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: relay-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - run: npm run typecheck:relay && npm run typecheck:relay-test
      # The relay's own suites, then the full flow against this checkout's Worker in local workerd.
      - run: npx vitest run tests/relay-core.test.ts tests/relay-routes.test.ts tests/relay-edge.test.ts tests/remote-e2e.test.ts tests/remote-mirror.test.ts tests/remote-host-lifecycle.test.ts tests/web-client.test.ts tests/browser-socket.test.ts tests/web-transport.test.ts tests/web-router.test.ts tests/web-shell.test.tsx tests/remote-workerd.test.ts
      - run: npm run test:relay-do
      # Build the web shell from source; a missing entry point must fail here, not on the origin.
      - run: npm run build:web
      - run: test -f relay/public/app/index.html
      - run: npx wrangler deploy --dry-run
        working-directory: relay
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the relay-production environment.' >&2
            exit 1
          fi
      - name: Publish vocs-relay
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
