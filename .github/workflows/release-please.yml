name: release-please

# Watches master (the release gate). Squash-merged PRs from develop land there
# with conventional titles; this bot turns them into a release PR that bumps
# package.json and writes CHANGELOG.md. Tags and empty drafts are created by
# the maintainer; only release.yml publishes complete releases. See docs/RELEASING.md.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          release-type: node
          target-branch: master
          # Never let the bot expose a release before the installer set is complete.
          skip-github-release: true
          token: ${{ secrets.RELEASE_PAT || github.token }}