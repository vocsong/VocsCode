# Develop PRs run a compact reviewed test gate. Full offline and no-provider E2E coverage is run
# before release to master (and on manual dispatch); paid/live tiers remain manual.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate, and the one place the POSIX branches of the path-handling suites get exercised.
  gate:
    name: typecheck · test · build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # NODE_ENV=production would drop every devDependency.
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      # The native search regressions exercise both real ripgrep and the JS fallback.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      # The develop gate uses a reviewed small set; the broad offline suite runs before release.
      - name: Focused develop regression suite
        if: >-
          github.event_name != 'workflow_dispatch' &&
          !(github.event_name == 'push' && github.ref == 'refs/heads/master') &&
          !(github.event_name == 'pull_request' && github.base_ref == 'master')
        run: npm run test:pr
        env:
          VOCS_CODE_TEST_REPORT: ${{ runner.temp }}/pr-report.json
      - name: Full offline suite
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' && github.base_ref == 'master')
        run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/full-report.json"
      - name: Summarize focused test timings
        if: always() && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master' && github.base_ref != 'master'
        run: node scripts/test-metrics.mjs "$RUNNER_TEMP/pr-report.json" develop-pr tests/artifacts/pr-metrics.json
      - name: Summarize full test timings
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.base_ref == 'master')
        run: node scripts/test-metrics.mjs "$RUNNER_TEMP/full-report.json" full-offline tests/artifacts/offline-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-report
          path: tests/artifacts/*-metrics.json
          if-no-files-found: ignore
          retention-days: 7
      # Run Hub + socket tags/queues in workerd; the Node fake cannot model DO hibernation.
      - run: npm run test:relay-do
      - run: npm run build

  # Full no-provider Electron coverage runs on Windows as part of release-to-master validation.
  e2e:
    name: e2e, no provider credit (windows)
    # The full browser suite is part of release-to-master/manual validation, not each develop PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - run: npm run build
      # Fails if a suite reports skipped: a green-but-dark run must not pass.
      - run: npm run test:e2e:ci
        env:
          VOCS_CODE_TEST_REPORT: ${{ runner.temp }}/e2e-report.json
          VOCS_CODE_E2E_WEB_PREBUILT: '1'
      - run: node scripts/test-metrics.mjs "${{ runner.temp }}/e2e-report.json" e2e tests/artifacts/e2e-metrics.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # The Ubuntu gate cannot execute Windows Job Objects, ConPTY or deep-path cases. Prove those
  # selected offline boundaries on the primary platform without needing a provider or installed Pi.
  windows-offline:
    name: Windows ownership and recovery (offline)
    # Keep the expensive real-Job/real-Git suite on release-to-master and manual runs;
    # the develop PR gate stays fast while the full platform suite remains enforced before release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      # A broken ConPTY guardian otherwise fails only after the long real-Git recovery file.
      # This is a fast diagnostic, not a substitute for the full no-skip gate below.
      - name: Preflight Windows terminal ownership
        shell: bash
        run: npx vitest run tests/mission-restart-recovery.test.ts -t 'recovers terminal only' --reporter=verbose
      - name: Execute Windows-only boundaries
        shell: bash
        run: |
          files=(tests/mission-check-job.test.ts tests/mission-terminal-windows.test.ts tests/mission-receipt-recovery.test.ts tests/mission-restart-recovery.test.ts tests/mission-pi-recovery.test.ts tests/mission-pi-process.test.ts tests/mission-git-boundary.test.ts tests/new-session-dialog.test.tsx tests/mcp-client.test.ts)
          npx vitest run "${files[@]}" --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/windows-offline-report.json"
          node scripts/test-report-check.mjs "$RUNNER_TEMP/windows-offline-report.json" "${files[@]}"
      - run: node scripts/test-metrics.mjs "${{ runner.temp }}/windows-offline-report.json" windows-offline tests/artifacts/windows-offline-metrics.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-offline-test-report
          path: tests/artifacts/windows-offline-metrics.json
          if-no-files-found: ignore
          retention-days: 7
