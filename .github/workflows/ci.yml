# Continuous verification for PRs into develop: the AGENTS.md gate plus the e2e tiers that need no
# provider credit. The live smoke/e2e tiers stay manual — they spend money and need a logged-in
# runtime — so they are deliberately absent here.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate, and the one place the POSIX branches of the path-handling suites get exercised.
  gate:
    name: typecheck · test · build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # NODE_ENV=production would drop every devDependency.
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      # The native search regressions exercise both real ripgrep and the JS fallback.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/offline-report.json"
      - run: node scripts/test-metrics.mjs "$RUNNER_TEMP/offline-report.json" offline tests/artifacts/offline-metrics.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-report
          path: tests/artifacts/offline-metrics.json
          if-no-files-found: ignore
          retention-days: 7
      # Run Hub + socket tags/queues in workerd; the Node fake cannot model DO hibernation.
      - run: npm run test:relay-do
      - run: npm run build

  # Windows is the app's primary target (ConPTY, the NSIS installer, the unpacked node-pty binaries),
  # so the Electron suites run there.
  e2e:
    name: e2e, no provider credit (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - run: npm run build
      # Fails if a suite reports skipped: a green-but-dark run must not pass.
      - run: npm run test:e2e:ci
        env:
          VOCS_CODE_TEST_REPORT: ${{ runner.temp }}/e2e-report.json
          VOCS_CODE_E2E_WEB_PREBUILT: '1'
      - run: node scripts/test-metrics.mjs "${{ runner.temp }}/e2e-report.json" e2e tests/artifacts/e2e-metrics.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # The Ubuntu gate cannot execute Windows Job Objects, ConPTY or deep-path cases. Prove those
  # selected offline boundaries on the primary platform without needing a provider or installed Pi.
  windows-offline:
    name: Windows ownership and recovery (offline)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - name: Execute Windows-only boundaries
        shell: bash
        run: |
          files=(tests/mission-check-job.test.ts tests/mission-terminal-windows.test.ts tests/mission-receipt-recovery.test.ts tests/mission-restart-recovery.test.ts tests/mission-pi-recovery.test.ts tests/mission-pi-process.test.ts tests/mission-git-boundary.test.ts tests/new-session-dialog.test.tsx tests/mcp-client.test.ts)
          npx vitest run "${files[@]}" --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/windows-offline-report.json"
          node scripts/test-report-check.mjs "$RUNNER_TEMP/windows-offline-report.json" "${files[@]}"
      - run: node scripts/test-metrics.mjs "${{ runner.temp }}/windows-offline-report.json" windows-offline tests/artifacts/windows-offline-metrics.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-offline-test-report
          path: tests/artifacts/windows-offline-metrics.json
          if-no-files-found: ignore
          retention-days: 7
