# Develop PRs run a compact reviewed test gate. Full offline and no-provider E2E coverage is run
# before release to master (and on manual dispatch); paid/live tiers remain manual.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate, and the one place the POSIX branches of the path-handling suites get exercised.
  gate:
    name: typecheck · test · build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # NODE_ENV=production would drop every devDependency.
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      # The native search regressions exercise both real ripgrep and the JS fallback.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      - run: node --test scripts/graphify-runtime.test.mjs
      # The develop gate uses a reviewed small set; the broad offline suite runs before release.
      - name: Focused develop regression suite
        if: >-
          github.event_name != 'workflow_dispatch' &&
          !(github.event_name == 'push' && github.ref == 'refs/heads/master') &&
          !(github.event_name == 'pull_request' && github.base_ref == 'master')
        run: npm run test:pr
        env:
          VOCS_CODE_TEST_REPORT: ${{ runner.temp }}/pr-report.json
      - name: Full offline suite
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' && github.base_ref == 'master')
        run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/full-report.json"
      - name: Summarize focused test timings
        if: always() && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master' && github.base_ref != 'master'
        run: node scripts/test-metrics.mjs "$RUNNER_TEMP/pr-report.json" develop-pr tests/artifacts/pr-metrics.json
      - name: Summarize full test timings
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.base_ref == 'master')
        run: node scripts/test-metrics.mjs "$RUNNER_TEMP/full-report.json" full-offline tests/artifacts/offline-metrics.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: offline-test-report
          path: tests/artifacts/*-metrics.json
          if-no-files-found: ignore
          retention-days: 7
      # Run Hub + socket tags/queues in workerd; the Node fake cannot model DO hibernation.
      - run: npm run test:relay-do
      - run: npm run build

  # Full no-provider Electron coverage runs on Windows as part of release-to-master validation.
  e2e:
    name: e2e, no provider credit (windows)
    # The full browser suite is part of release-to-master/manual validation, not each develop PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - run: node scripts/graphify-runtime.mjs prepare
      - run: npm run build
      # Fails if a suite reports skipped: a green-but-dark run must not pass.
      - run: npm run test:e2e:ci
        env:
          VOCS_CODE_TEST_REPORT: ${{ runner.temp }}/e2e-report.json
          VOCS_CODE_E2E_WEB_PREBUILT: '1'
          VOCS_CODE_GRAPHIFY_E2E: '1'
      - run: node scripts/test-metrics.mjs "${{ runner.temp }}/e2e-report.json" e2e tests/artifacts/e2e-metrics.json
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Package-only regressions need the real asar layout, not Electron launched against out/.
  # Keep this behind the full E2E gate; ordinary develop PRs do not build installers.
  packaged-smoke:
    name: Windows packaged-app smoke (offline)
    needs: [gate, e2e]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - run: npm run dist:dir -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify bundled Graphify in the unpacked app
        run: node scripts/graphify-smoke.mjs --packaged
      - name: Launch packaged app and verify IPC and shutdown
        timeout-minutes: 5
        run: node scripts/e2e-guard.mjs tests/e2e.packaged.test.ts
        env:
          HARNESS_E2E_EXE: ${{ github.workspace }}/dist/win-unpacked/Vocs Code.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: packaged-smoke-failure
          path: tests/artifacts/packaged-smoke/
          if-no-files-found: warn
          retention-days: 7

  # The Ubuntu gate cannot execute Windows Job Objects, ConPTY, named-pipe ACLs or deep-path cases.
  # Prove those offline boundaries without needing a provider or installed Pi.
  windows-offline:
    name: Windows ownership and recovery (offline)
    # Keep the Windows-only suites on release-to-master and manual runs; the develop PR gate stays
    # fast while the platform suites remain enforced before release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
        env:
          NODE_ENV: development
      - name: Execute Windows-only boundaries
        shell: bash
        run: |
          files=(tests/new-session-dialog.test.tsx tests/mcp-client.test.ts tests/local-control-windows.test.ts)
          npx vitest run "${files[@]}" --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/windows-offline-report.json"
          node scripts/test-report-check.mjs "$RUNNER_TEMP/windows-offline-report.json" "${files[@]}"
      - run: node scripts/test-metrics.mjs "${{ runner.temp }}/windows-offline-report.json" windows-offline tests/artifacts/windows-offline-metrics.json
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-offline-test-report
          path: tests/artifacts/windows-offline-metrics.json
          if-no-files-found: ignore
          retention-days: 7
