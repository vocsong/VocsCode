appId: dev.vocs.vocscode
productName: Vocs Code
copyright: Copyright © 2026 Vocs
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/pi
    to: pi
asarUnpack:
  - node_modules/@anthropic-ai/**
  - node_modules/@openai/**
  # node-pty's prebuilt N-API binaries (and ConPTY's DLLs) must be real files, not asar entries.
  - node_modules/@lydell/**
# Every native dependency ships prebuilt (@lydell/node-pty); nothing needs a compiler at install time.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Vocs-Code-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Vocs Code
mac:
  target: [dmg]
  category: public.app-category.developer-tools
linux:
  target: [AppImage]
  category: Development
