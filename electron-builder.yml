appId: dev.vocs.vocscode
productName: Vocs Code
copyright: Copyright © 2026 Vocs
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/pi
    to: pi
  - from: resources/icons
    to: icons
asarUnpack:
  - node_modules/@anthropic-ai/**
  - node_modules/@openai/**
  # @cursor/sdk's per-platform native binaries (cursorsandbox, rg, tree-sitter) must sit next to
  # the executable, like node-pty's ConPTY DLLs.
  - node_modules/@cursor/**
  # node-pty's prebuilt N-API binaries (and ConPTY's DLLs) must be real files, not asar entries.
  - node_modules/@lydell/**
# Every native dependency ships prebuilt (@lydell/node-pty); nothing needs a compiler at install time.
npmRebuild: false
# Publish to the published release the tag points at (default 'draft' skips when the
# release already exists). Also emits latest.yml for a future electron-updater.
publish:
  provider: github
  releaseType: release
win:
  icon: resources/icons/vocs-code.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Vocs-Code-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Vocs Code
mac:
  icon: resources/icons/vocs-code.icns
  target:
    - target: dmg
      # Ship both silicon generations; CI builds both on the arm64 runner.
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: Vocs-Code-${version}-mac-${arch}.${ext}
linux:
  icon: resources/icons/vocs-code.png
  target: [AppImage]
  category: Development
  artifactName: Vocs-Code-${version}-linux-${arch}.${ext}
